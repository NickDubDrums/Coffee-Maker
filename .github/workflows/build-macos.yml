name: Build macOS Universal Binary

on:
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS Universal Binary (VST3 + AU + AAX)
    runs-on: macos-14        # Apple Silicon runner — supports both arm64 and x86_64

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ── Xcode ───────────────────────────────────────────────────────────────
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # ── CMake ───────────────────────────────────────────────────────────────
      - name: Verify CMake version
        run: cmake --version

      # ── Download AAX SDK from private repo ──────────────────────────────────
      - name: Download AAX SDK
        run: |
          curl -L \
            -H "Authorization: token ${{ secrets.SDK_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github.v3.raw" \
            "https://api.github.com/repos/NickDubDrums/dev-sdks/contents/aax-sdk-2-9-0.zip" \
            -o aax-sdk.zip
          unzip -q aax-sdk.zip -d aax-sdk
          echo "AAX SDK contents:"
          ls aax-sdk/

      # ── Configure ───────────────────────────────────────────────────────────
      - name: Configure CMake
        run: |
          cmake -B build-mac \
                -G Xcode \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
                -DAAX_SDK_PATH="${{ github.workspace }}/aax-sdk/aax-sdk-2-9-0"

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build Release
        run: |
          cmake --build build-mac \
                --config Release \
                --parallel $(sysctl -n hw.logicalcpu)

      # ── Verify Universal Binary ───────────────────────────────────────────────
      - name: Verify Universal Binary
        run: |
          VST3=$(find build-mac -path "*/VST3/*.vst3/Contents/MacOS/*" -type f | head -1)
          if [ -n "$VST3" ]; then
            echo "Checking VST3: $VST3"
            lipo -info "$VST3"
          else
            echo "VST3 binary not found"
          fi
          AAX=$(find build-mac -path "*/AAX/*.aaxplugin/Contents/MacOS/*" -type f | head -1)
          if [ -n "$AAX" ]; then
            echo "Checking AAX: $AAX"
            lipo -info "$AAX"
          else
            echo "AAX binary not found"
          fi

      # ── Collect artefacts ────────────────────────────────────────────────────
      - name: Collect plugin bundles
        run: |
          mkdir -p dist
          find build-mac -name "*.vst3"       -type d | xargs -I{} cp -r {} dist/ 2>/dev/null || true
          find build-mac -name "*.component"  -type d | xargs -I{} cp -r {} dist/ 2>/dev/null || true
          find build-mac -name "*.aaxplugin"  -type d | xargs -I{} cp -r {} dist/ 2>/dev/null || true
          echo "Contents of dist/:"
          ls -la dist/

      # ── Zip ─────────────────────────────────────────────────────────────────
      - name: Create release archive
        run: |
          cd dist
          zip -r ../Coffee_Maker-macOS-universal.zip .
          cd ..
          echo "Archive size: $(du -sh Coffee_Maker-macOS-universal.zip | cut -f1)"

      # ── Upload artefact ──────────────────────────────────────────────────────
      - name: Upload build artefact
        uses: actions/upload-artifact@v5
        with:
          name: Coffee_Maker-macOS-universal
          path: Coffee_Maker-macOS-universal.zip
          retention-days: 30

      # ── Create GitHub release on tag push ────────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Coffee_Maker-macOS-universal.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
